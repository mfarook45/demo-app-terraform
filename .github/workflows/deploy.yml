name: CI-CD Pipeline

on:
  push:
    branches: [ "gitops-argocd" ]

env:
  PROJECT_ID: serene-bliss-499420-p4
  REGION: europe-north1
  CLUSTER: my-cluster
  ZONE: europe-north1-a
  IMAGE: europe-north1-docker.pkg.dev/serene-bliss-499420-p4/my-app-repo/demo-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-north1-docker.pkg.dev

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: gitops-argocd
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update image tag in deployment.yaml
      run: |
        sed -i "s|image: europe-north1-docker.pkg.dev.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" deployment.yaml

    - name: Verify change was made
      run: cat deployment.yaml

    - name: Commit and push updated deployment.yaml
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add deployment.yaml
        git commit -m "ci: update image tag to ${{ github.sha }}"
        git push origin gitops-argocd